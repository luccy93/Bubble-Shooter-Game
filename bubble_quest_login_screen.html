<style>
        .glass-panel {
            background: rgba(44, 40, 52, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid rgba(207, 189, 255, 0.2);
            border-bottom: 1px solid rgba(207, 189, 255, 0.2);
        }
        
        .hero-btn {
            background: linear-gradient(180deg, #cfbdff 0%, #6200ee 100%);
            box-shadow: 0px 4px 0px #3a0093, 0px 0px 20px rgba(98, 0, 238, 0.6);
            transition: all 0.1s ease;
        }
        
        .hero-btn:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #3a0093, 0px 0px 10px rgba(98, 0, 238, 0.4);
        }
        
        .input-glass {
            background: rgba(21, 18, 28, 0.6);
            border: 1px solid rgba(148, 141, 162, 0.4);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .input-glass:focus {
            border-color: #cfbdff;
            box-shadow: 0 0 10px rgba(207, 189, 255, 0.3);
            outline: none;
        }
        
        .bg-animated {
            background: radial-gradient(circle at 50% 50%, #22005d 0%, #15121c 100%);
            position: relative;
            overflow: hidden;
        }
        
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: stars 100s linear infinite;
            opacity: 0.5;
        }
        
        @keyframes stars {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }
    </style>
<style>

<body class="bg-background text-on-surface h-screen w-screen overflow-hidden font-body-md bg-animated flex items-center justify-center p-margin-mobile">
<div class="stars"></div>
<div class="stars" style="background-size: 300px 300px; animation-duration: 150s; opacity: 0.3;"></div>
<div class="glass-panel w-full max-w-md rounded-xl p-md flex flex-col gap-md relative z-10 shadow-[0_8px_32px_0_rgba(31,38,135,0.37)]">
<!-- Header -->
<div class="text-center mb-sm">
<h1 class="font-display-xl text-[40px] md:text-display-xl text-primary-fixed-dim drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)] mb-xs">Bubble Quest</h1>
<p class="font-body-md text-on-surface-variant">Enter the magical realm</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-sm">
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="input-glass w-full rounded-lg h-12 pl-[44px] pr-sm font-body-md text-on-surface placeholder:text-outline" id="email" placeholder="adventurer@quest.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="input-glass w-full rounded-lg h-12 pl-[44px] pr-sm font-body-md text-on-surface placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-sm mt-sm">
<button class="hero-btn w-full h-14 rounded-lg flex items-center justify-center font-headline-md text-headline-md text-secondary" type="button">
                    Sign In
                </button>
<div class="flex items-center gap-sm my-xs">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">OR</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<button class="w-full h-12 rounded-lg border border-outline-variant hover:bg-surface-variant/50 transition-colors flex items-center justify-center font-label-lg text-label-lg text-primary" type="button">
                    Create New Account
                </button>
</div>
</form>
</div>
