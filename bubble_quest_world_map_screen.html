<style>/* Custom styles for 3D and glow effects */
.glass-panel {
    background: rgba(44, 40, 52, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, 0.3);
    border-left: 1px solid rgba(255, 255, 255, 0.3);
    border-bottom: 1px solid rgba(207, 189, 255, 0.2);
    border-right: 1px solid rgba(207, 189, 255, 0.2)
    }
.level-node-locked {
    background: linear-gradient(145deg, #37333f, #211e29);
    box-shadow: 0 4px 0 #15121c, inset 0 2px 4px rgba(255, 255, 255, 0.1)
    }
.level-node-completed {
    background: linear-gradient(145deg, #00e475, #00612e);
    box-shadow: 0 4px 0 #003918, inset 0 2px 4px rgba(255, 255, 255, 0.4)
    }
.level-node-active {
    background: linear-gradient(145deg, #cfbdff, #6200ee);
    box-shadow: 0 6px 0 #3a0093, 0 0 20px rgba(207, 189, 255, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.6);
    animation: pulse-glow 2s infinite alternate
    }
.currency-chip {
    background: linear-gradient(145deg, rgba(255, 219, 60, 0.9), rgba(233, 196, 0, 0.9));
    box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.5), 0 2px 4px rgba(0, 0, 0, 0.3)
    }
.lives-chip {
    background: linear-gradient(145deg, rgba(255, 180, 171, 0.9), rgba(147, 0, 10, 0.9));
    box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.5), 0 2px 4px rgba(0, 0, 0, 0.3)
    }
@keyframes pulse-glow {
    0% {
        box-shadow: 0 6px 0 #3a0093, 0 0 10px rgba(207, 189, 255, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.6);
        transform: scale(1);
        } 100% {
        box-shadow: 0 6px 0 #3a0093, 0 0 30px rgba(207, 189, 255, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.8);
        transform: scale(1.05);
        }
    }
@keyframes float {
    0% {
        transform: translateY(0px);
        } 50% {
        transform: translateY(-10px);
        } 100% {
        transform: translateY(0px);
        }
    }
.floating {
    animation: float 4s ease-in-out infinite
    }
/* Map background setup */
.map-container {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuD0B-BdRkzAsHCtr7GkEu7GZ33Xk87Hp6MNrlwc5l74FIOF_Xz-hF3mE9QhgN5h6gBQzgqr_5hBBPky_HChzntJ45-miucRihfHpvgaUFoO74mfLM_rLHhAE2hylg5m15MH0fI_r0jUIu82sIlYg5-2UnSNHUghQuTuardtxHeLuSQx3U64TcIkMuh-unQuzbNBiA0PomfU26_mFXZ89cwRKNCdVFC4DWFD_RO0YnEeEdXoyh6mpCyDOw);

    background-position: center bottom;
    height: 200vh;

<body class="bg-background text-on-surface font-body-md overflow-x-hidden antialiased">
<!-- TopAppBar -->

<div class="flex items-center gap-sm">

</div>
<!-- Floating HUD Currency -->
<div class="flex gap-sm">
<div class="lives-chip flex items-center rounded-full px-3 py-1 border border-white/20">
<span class="material-symbols-outlined text-on-error mr-1" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="font-label-lg text-label-lg text-white drop-shadow-md">5</span>
</div>
<div class="currency-chip flex items-center rounded-full px-3 py-1 border border-white/20">

</div>
</div>

</svg>

</div>

<div class="flex flex-col items-center gap-2 floating">

<span class="material-symbols-outlined text-secondary-fixed-dim text-3xl animate-bounce drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)]" style="font-variation-settings: 'FILL' 1;">arrow_drop_down</span>

</div>
</div>

</button>
</div>
</div>

</button>

<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm mt-1">Menu</span>
</a>

<script>
        // Auto-scroll to active level on load for a better UX
        document.addEventListener("DOMContentLoaded", () => {
            const activeLevel = document.querySelector('.level-node-active');
            if (activeLevel) {
                // Scroll to position active level roughly in center view
                activeLevel.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    </script>
