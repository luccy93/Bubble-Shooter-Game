<style>
        .glass-panel {
            background: rgba(33, 30, 41, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .btn-3d {
            position: relative;
            transition: all 0.1s ease;
        }
        
        .btn-3d:active {
            transform: translateY(4px);
        }
        
        .btn-3d::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: -4px;
            border-radius: inherit;
            z-index: -1;
            background: inherit;
            filter: brightness(0.7);
        }
        
        .btn-3d:active::after {
            bottom: 0;
        }
        
        .hero-glow {
            animation: pulse-glow 3s infinite alternate;
        }
        
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(207, 189, 255, 0.5); }
            100% { box-shadow: 0 0 40px rgba(207, 189, 255, 0.8), 0 0 10px rgba(255, 255, 255, 0.5) inset; }
        }
        
        body {
            background-color: #15121c; /* background */
            color: #e7e0f0; /* on-background */
        }
    </style>
