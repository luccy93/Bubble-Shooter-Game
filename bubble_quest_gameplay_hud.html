<style>
  /* Base Magical Theme Overrides */
  body {
    background: radial-gradient(circle at top, #2a1b4d 0%, #15121c 100%);
    color: #e7e0f0;
    overflow: hidden;
  }
  
  /* Utilities for glass panels and glowing effects */
  .glass-panel {
    background: rgba(44, 40, 52, 0.4);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, 0.3);
    border-left: 1px solid rgba(255, 255, 255, 0.3);
    border-right: 1px solid rgba(207, 189, 255, 0.2);
    border-bottom: 1px solid rgba(207, 189, 255, 0.2);
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
  }
  
  .glow-primary {
    box-shadow: 0 0 15px rgba(207, 189, 255, 0.5);
  }
  
  .glow-accent {
    box-shadow: 0 0 20px rgba(0, 228, 117, 0.6);
  }

  /* 3D Button Styles */
  .btn-3d {
    position: relative;
    transition: transform 0.1s;
    box-shadow: 0 4px 0 0 rgba(0,0,0,0.4);
  }
  .btn-3d:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 0 rgba(0,0,0,0.4);
  }

  /* Bubble Styles */
  .bubble {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    position: relative;
    box-shadow: inset -4px -4px 10px rgba(0,0,0,0.5), inset 4px 4px 10px rgba(255,255,255,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  
  .bubble::after {
    content: '';
    position: absolute;
    top: 5px;
    left: 10px;
    width: 15px;
    height: 8px;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    transform: rotate(-45deg);
  }

  .bubble-red { background: radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b); }
  .bubble-blue { background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe); }
  .bubble-green { background: radial-gradient(circle at 30% 30%, #43e97b, #38f9d7); }
  .bubble-yellow { background: radial-gradient(circle at 30% 30%, #f6d365, #fda085); }
  .bubble-purple { background: radial-gradient(circle at 30% 30%, #b8c6db, #f5f7fa); }

  /* Grid Layout for Bubbles */
  .bubble-grid {
    display: grid;
    grid-template-columns: repeat(9, 40px);
    gap: 2px;
    justify-content: center;
    padding-top: 20px;
  }
  
  /* Staggered Rows */
  .bubble-grid .row-even {
    transform: translateX(21px); /* Half bubble + gap */
  }

  /* Aiming Line */
  .aim-line {
    position: absolute;
    width: 4px;
    height: 150px;
    background: repeating-linear-gradient(to top, rgba(255,255,255,0.8) 0, rgba(255,255,255,0.8) 5px, transparent 5px, transparent 15px);
    bottom: 120px;
    left: 50%;
    transform-origin: bottom center;
    transform: translateX(-50%) rotate(-15deg);
    z-index: 10;
    pointer-events: none;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
  }
  
  /* Progress Bar Glow */
  .progress-fill {
    background: linear-gradient(90deg, #00e475, #62ff96);
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 10px;
    background: rgba(255,255,255,0.8);
    filter: blur(2px);
  }
</style>
